<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Карта неба</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a phone star-finder app — deep indigo sky, purple figures, quiet round controls
   IDEA: hold-up sky map: the whole screen is sky; a small readout tells where you point
   PICTURE: full-screen indigo sky, violet constellation lines and names, orange ecliptic, glowing horizon
   COLOUR and TYPE: indigo #07083f, violet #8a6cd8, lilac names, orange planets, amber accent #ffc21a; Roboto
   LAYOUT: readout top-right, layer pill on the left, round action buttons bottom-right, settings as a full screen */
:root{color-scheme:dark;--bg:#06072e;--ink:#eef0ff;--mute:#9ea6c8;--bar:rgba(18,22,52,.92);--line:rgba(255,255,255,.1);--acc:#ffc21a;--btn:#1d3043;--glass:linear-gradient(160deg,rgba(48,56,128,.5),rgba(10,12,40,.62));--blur:blur(16px) saturate(1.5);--sh:0 12px 32px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.1);--gl:1px solid rgba(255,255,255,.13)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
body.red{--ink:#ff6b5a;--mute:#b0463a;--acc:#ff5a44;--line:rgba(255,90,68,.22);--bar:rgba(22,3,2,.95);--btn:#2a0905}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Roboto,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button,input,select{font:inherit;color:inherit}
.chrome{transition:opacity .3s}
body.hideui .chrome{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){.chrome{transition:none}}
.ib{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--ink)}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.ev:focus-visible,.set:focus-visible,.mi:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#info{position:fixed;top:12px;right:10px;padding:12px 18px;border-radius:20px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:var(--gl);box-shadow:var(--sh);font-size:15px;pointer-events:none}
#info dl{grid-template-columns:auto auto;gap:3px 24px;font-size:15px}
#info dt{color:#98a2d8}#info dd{font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
#strip{position:fixed;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:var(--gl);box-shadow:var(--sh);border-radius:30px}
#strip .ib{color:#7c86b4;transition:color .2s,background .2s,box-shadow .2s}
#strip .ib:hover{color:#c9d0f5}
#strip .ib[aria-pressed=true]{color:#ffd75a;background:radial-gradient(circle at 50% 40%,rgba(255,200,60,.34),rgba(255,140,0,.1));box-shadow:0 0 16px rgba(255,190,40,.3),inset 0 0 0 1px rgba(255,210,90,.35)}
#strip hr{width:30px;border:0;border-top:1px solid var(--line);margin:2px auto}
#strip #m-layers2{color:#9fd0ff}
#btns{position:fixed;right:10px;bottom:14px;display:flex;gap:10px}
#btns .ib{width:52px;height:52px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:var(--gl);box-shadow:var(--sh);color:#e3e8ff;transition:transform .15s,background .2s}
#btns .ib:active{transform:scale(.92)}
#btns #b-search{background:linear-gradient(145deg,#ffdf6e,#ff9a1a);border-color:rgba(255,230,150,.6);color:#2a1700;box-shadow:0 8px 24px rgba(255,160,30,.45),inset 0 1px 0 rgba(255,255,255,.5)}
body.red #btns .ib{color:var(--ink);background:var(--btn);box-shadow:none}body.red #btns #b-search{color:#200;background:var(--acc)}
#menu{position:fixed;z-index:4;right:10px;bottom:76px;min-width:230px;padding:6px 0;border-radius:14px;background:linear-gradient(165deg,rgba(44,50,116,.86),rgba(14,16,46,.92));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:var(--gl);box-shadow:var(--sh);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
#menu[hidden]{display:none}
.mi{display:block;width:100%;min-height:48px;padding:0 18px;border:0;background:none;text-align:left;font-size:16px;cursor:pointer}
.mi:hover{background:rgba(255,255,255,.07)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);padding:10px 16px;border-radius:20px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:var(--gl);box-shadow:var(--sh);font-size:14px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
#toast.on{opacity:1}
#timebar{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px 6px 4px 14px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:var(--gl);box-shadow:var(--sh);border-radius:28px;max-width:calc(100% - 12px)}
#timebar[hidden]{display:none}
#tbtext{font-size:13px;line-height:1.25;margin-right:6px;white-space:nowrap}
#tbtext small{display:block;color:var(--mute)}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:22px;background:rgba(255,255,255,.09);font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn{transition:background .15s,transform .15s}.btn:hover{background:rgba(255,255,255,.16)}.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(145deg,#ffdf6e,#ff9a1a);color:#2a1700;box-shadow:0 6px 18px rgba(255,160,30,.35)}
body.red .btn.pri{background:var(--acc);box-shadow:none;color:#200}
.sheet,.card{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 16px));background:linear-gradient(165deg,rgba(44,50,118,.84),rgba(12,14,42,.9));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:var(--gl);box-shadow:var(--sh);border-radius:24px;padding:18px;animation:rise .28s cubic-bezier(.2,.8,.2,1);max-height:calc(100dvh - 120px);overflow:auto;user-select:text;z-index:3}
.sheet{top:12px}.card{bottom:80px}
.sheet[hidden],.card[hidden]{display:none}
.sheet h2,.card h2{margin:0 0 10px;font-size:22px;font-weight:700;line-height:1.15;color:#fff}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}}
#menu{animation-name:fade}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.sheet,.card,#menu{animation:none}}
input[type=search],input[type=number],input[type=datetime-local],select{width:100%;min-height:46px;font-size:16px;padding:8px 14px;border-radius:23px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
select{border-radius:12px}select option{background:#14172f}
.list{list-style:none;margin:8px 0 0;padding:0}
.list button,.ev{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;padding:8px 10px;border:0;border-radius:10px;background:transparent;cursor:pointer}
.list button:hover,.ev:hover{background:rgba(255,255,255,.07)}
.list small,.ev small,.mute{color:var(--mute);font-size:13px;text-align:right}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:8px 0}
.grid2 label{font-size:13px;color:var(--mute)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:15px}
dt{color:var(--mute)}dd{margin:0;text-align:right;white-space:nowrap}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kind{margin:-6px 0 10px;color:var(--mute);font-size:14px}
.warn{margin:10px 0 0;font-size:14px;color:#ffcf6b}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#perm{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(3,4,25,.9);font-size:17px;z-index:6}#perm[hidden]{display:none}#perm p{max-width:320px;margin:0 0 8px}
#settings{position:fixed;inset:0;background:radial-gradient(120% 55% at 50% 0%,#262d70,#0a0d26 72%);overflow:auto;z-index:5;user-select:text}
#settings[hidden]{display:none}
.shead{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:10px 8px;background:rgba(18,22,58,.72);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid rgba(255,255,255,.08);font-size:26px;font-weight:700;z-index:1}
.sec{margin:26px 20px 6px;color:var(--acc);font-size:19px;font-weight:500}
.set{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:12px 20px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.set:hover{background:rgba(255,255,255,.04)}
.set .t{flex:1}.set b{display:block;font-size:18px;font-weight:400;line-height:1.3}.set span{display:block;font-size:14px;color:var(--mute);line-height:1.4;margin-top:2px}
.val{color:var(--acc);font-size:17px;white-space:nowrap}
.sw{flex:none;width:54px;height:32px;border-radius:16px;border:2px solid #485074;position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:5px;left:5px;width:18px;height:18px;border-radius:50%;background:#485074;transition:all .2s}
.set[aria-checked=true] .sw{background:linear-gradient(135deg,#ffdf6e,#ff9a1a);border-color:#ffb43a;box-shadow:0 0 12px rgba(255,170,40,.35)}
body.red .set[aria-checked=true] .sw{background:var(--acc);box-shadow:none}
.set[aria-checked=true] .sw::after{left:25px;top:3px;width:22px;height:22px;background:#2a1f00}
.set input{width:90px;flex:none;text-align:right}
.note{margin:4px 20px 30px;font-size:13px;color:var(--mute)}
body.red #info,body.red #strip,body.red .sheet,body.red .card,body.red #menu,body.red #timebar,body.red #toast{background:var(--bar);box-shadow:none;border-color:var(--line)}

body.red #info dt{color:var(--mute)}body.red #info dd,body.red .sheet h2,body.red .card h2{color:var(--ink)}
body.red #settings,body.red .shead{background:#0d0201}

</head>

</nav>
<div id="menu" hidden role="menu">
  <button class="mi" id="b-place" role="menuitem">Место наблюдения</button>
  <button class="mi" id="m-layers" role="menuitem">Слои</button>
  <button class="mi" id="m-set" role="menuitem">Настройки</button>

<div id="toast" role="status"></div>
<div id="perm" hidden><p>Небо будет двигаться вместе с телефоном. Наведите телефон на небо.</p><button class="btn" id="perm-ok">Включить датчики</button><button class="btn" id="perm-no" style="background:transparent">Ручной режим</button></div>

  <button class="ib" id="t-pp" aria-label="Пуск / пауза"><svg viewBox="0 0 24 24" id="ppicon"><path d="M8 6v12l10-6z"/></svg></button>

  <button class="btn" id="t-now">Сейчас</button>
</div>

<section class="sheet" id="sh-search" hidden>

  <ul class="list" id="res"></ul>
</section>

<section class="sheet" id="sh-time" hidden>
  <h2>Путешествие во времени</h2>

  <input type="datetime-local" id="dt" aria-label="Дата и время">
  <div class="row"><button class="btn pri" id="go-dt">Перейти</button></div>
</section>

<section class="sheet" id="sh-place" hidden>

  <div class="grid2">

    <div><label for="lon">Долгота, °</label><input type="number" id="lon" step="0.01" min="-180" max="180"></div>

</section>

function events(){const now=Date.now();setup(now);const rs=riseSet(sunObj(),now),d=local(now),mid=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+1)-st.place.tz*36e5;
  const met=n=>mets.find(m=>m.name===n);
  const ev=[['Сейчас','реальное время',now,1],['Закат',hm(rs.set),rs.set],['Полночь',dateStr(mid),mid],['Восход',hm(rs.rise),rs.rise],
   ['Геминиды — пик','14 дек 2026, ночь',Date.UTC(2026,11,13,21),0,met('Геминиды')],['Квадрантиды — пик','4 янв 2027, перед рассветом',Date.UTC(2027,0,3,23),0,met('Квадрантиды')],['Лириды — пик','23 апр 2027, ночь',Date.UTC(2027,3,22,21),0,met('Лириды')],['Эта-Аквариды — пик','6 мая 2027, перед рассветом',Date.UTC(2027,4,5,23),0,met('Эта-Аквариды')],['Солнечное затмение','2 авг 2027 (полное в Египте и Аравии)',Date.UTC(2027,7,2,10,7),0,sunObj],['Персеиды — пик','13 авг 2027, ночь',Date.UTC(2027,7,12,21),0,met('Персеиды')]].filter(e=>e[2]>=now-6e4||e[0]==='Сейчас');
  const box=$('#events');box.innerHTML='';ev.forEach(e=>{const b=document.createElement('button');b.className='ev';b.innerHTML='<span></span><small></small>';b.firstChild.textContent=e[0];b.lastChild.textContent=e[1];b.onclick=()=>{if(e[0]==='Сейчас'){st.off=0;st.rate=1;st.target=null;closeSheets();dirty=true}else goTime(e[2],e[3]||0,e[4])};box.append(b)})}
function syncDT(){const d=local(nowMs());$('#dt').value=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`}
$('#go-dt').onclick=()=>{const m=$('#dt').value.match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);if(!m)return;goTime(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5])-st.place.tz*36e5,0)};
const ri=()=>RATES.indexOf(st.rate);
$('#t-rw').onclick=()=>{st.rate=RATES[Math.max(0,ri()-1)];dirty=true};$('#t-ff').onclick=()=>{st.rate=RATES[Math.min(RATES.length-1,ri()+1)];dirty=true};
$('#t-pp').onclick=()=>{st.rate=st.rate===0?1:0;dirty=true};$('#t-now').onclick=()=>{st.off=0;st.rate=1;dirty=true};
// place
const sel=$('#city');sel.innerHTML=CITIES.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('');
function setPlace(p){st.place=p;store.set('place',p);$('#lat').value=p.lat;$('#lon').value=p.lon;const i=CITIES.findIndex(c=>c[0]===p.name);sel.value=i<0?CITIES.length-1:i;dirty=true}
sel.onchange=()=>{const c=CITIES[sel.value];if(c[1]!=null){setPlace({name:c[0],lat:c[1],lon:c[2],tz:c[3]});toast('Место: '+c[0])}};
$('#apply').onclick=()=>{const la=+$('#lat').value,lo=+$('#lon').value;if(!isFinite(la)||!isFinite(lo)||Math.abs(la)>90||Math.abs(lo)>180)return;setPlace({name:'Свои координаты',lat:la,lon:lo,tz:-new Date().getTimezoneOffset()/60});toast('Координаты применены')};
setPlace(st.place);showUI();

// loop
let lastT=performance.now(),lastTick=0;
function loop(now){const dt=now-lastT;lastT=now;
  if(st.rate!==1){st.off+=dt*(st.rate-1);if(st.rate!==0)dirty=true}
  if(st.anim){const k=Math.min(1,(now-st.anim.t0)/800),e=1-(1-k)**3;st.az=st.anim.az0+st.anim.daz*e;st.alt=st.anim.al0+st.anim.dal*e;if(k>=1)st.anim=null;dirty=true}
  if(now-lastTick>1e4){lastTick=now;dirty=true}
  if(dirty)draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
</script>
</body>
</html>
