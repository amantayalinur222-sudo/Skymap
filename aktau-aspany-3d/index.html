<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ақтау аспаны 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Sans+Narrow:wght@700&family=PT+Mono&display=swap">
<style>
/* VOICE: a calm planetarium instrument that starts as a street map.
   IDEA: map → pin → sky. Like a maps app, but the "street view" looks up at the stars.
   PICTURE: full-width canvas: a light top-down map of Aktau; tap drops a pin; the pin opens the sky from that spot.
   COLOUR and TYPE: map in light map tones (land #f2efe9, water #aadaff); sky in deep night #070b16 with star gold; PT Sans family.
   LAYOUT: title row, big frame with map/globe/sky switch, then the time/view deck. */
:root{color-scheme:dark;--bg:#070b16;--panel:#0e1526;--line:#22304d;--fg:#e6e9f2;--muted:#8f9ab3;--accent:#f2c14e;--accent-ink:#1a1405;
  --fd:"PT Sans Narrow","PT Sans","Arial Narrow",sans-serif;--fb:"PT Sans","Segoe UI",Roboto,sans-serif;--fm:"PT Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--fb);overflow-x:clip}
#panel{position:fixed;z-index:5;right:max(8px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 40px);width:min(380px,calc(100vw - 16px));max-height:calc(100dvh - 60px - env(safe-area-inset-top));overflow:auto;
  background:rgba(7,11,22,.96);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:14px}
#panel[hidden]{display:none}
.nbtn{right:calc(max(8px,env(safe-area-inset-right)) + 40px)!important;display:grid;place-items:center}
.nbtn[aria-pressed=true]{color:var(--accent)!important;border-color:var(--accent)!important}
/* night mode: everything turns deep red to keep dark-adapted eyes */
/* night mode: darker map and controls, brighter stars (handled in the renderer) */
body.night .frame.map canvas{filter:brightness(.5) saturate(.7)}
body.night #nav,body.night .pill,body.night .zoom button,body.night .mbtn,body.night .sheet,body.night .readout,body.night .hint,body.night #panel,body.night .search input{background:rgba(0,0,0,.82)!important;border-color:#1a2236!important}
body.night .lb.mm,body.night .lb.mpoi{opacity:.7}
.mbtn{position:absolute;z-index:4;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(14,21,38,.92);color:var(--fg);font-size:17px;cursor:pointer;padding:0}
.frame.light .mbtn{background:#fff;color:#3c4043;border-color:#dadce0;box-shadow:0 1px 3px rgba(0,0,0,.25)}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font:700 24px/1.1 var(--fd);margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.tops{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=datetime-local],input[type=search]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;font-size:16px;min-height:32px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{background:transparent;color:var(--muted);border:0;padding:0 10px;min-height:30px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg button:disabled{opacity:.35;cursor:default}
.frame{position:fixed;inset:0;overflow:hidden;background:#000;height:100vh;height:100dvh}
body{overflow:hidden}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.frame canvas:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:13px;color:#c9d2e8;text-shadow:0 0 4px #000,0 0 2px #000;will-change:transform}
.lb.con{color:#7fa1d9}
.lb.con.focus{color:#ffd27a;font:700 19px var(--fd);letter-spacing:.03em}
.lb.star{color:#e9edf7}
.lb.pl{color:#ffd27a;font-weight:700;font-size:14px}
.lb.card{color:var(--accent);font:700 18px var(--fd)}
.lb.pin{font-weight:700;background:rgba(242,193,78,.9);color:#1a1405;padding:1px 7px;border-radius:4px;text-shadow:none}
.lb.mkr{pointer-events:auto;cursor:pointer;color:#fff;font:700 14px var(--fd);background:rgba(14,21,38,.82);border:1px solid rgba(242,193,78,.6);padding:0 6px;border-radius:4px}
.lb.mkr:hover{background:var(--accent);color:var(--accent-ink)}
.lb.lm{color:#ffd27a;font-weight:700}
.lb.sea{color:#9cd3ff;font:italic 15px var(--fb);letter-spacing:.05em}
/* map labels: dark ink with a white halo, like a street map */
.lb.mm{pointer-events:auto;cursor:pointer;color:#b9babd;font:italic 15px/1.15 var(--fb);text-align:center;white-space:pre;text-shadow:0 0 3px #2b2c2f,0 0 3px #2b2c2f}
.lb.mm:hover{color:var(--accent)}
.lb.msea{color:#7fa6d6;font:italic 16px var(--fb);letter-spacing:.12em;text-shadow:none}
.lb.mpoi{color:#c9b28a;font:italic 13px var(--fb);text-shadow:0 0 3px #2b2c2f}
.lb.mpoi[data-k=mosque]::before{background:#2e9c72}.lb.mpoi[data-k=clinic]::before{background:#d93025}.lb.mpoi[data-k=school]::before,.lb.mpoi[data-k=kinder]::before{background:#f2a33a}.lb.mpoi[data-k=mall]::before{background:#8e5bd6}
.lb.mpoi::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#e8710a;border:2px solid #fff;margin-right:5px;vertical-align:-1px}
.lb.mcity{color:#e6e9f2;font:700 22px var(--fb);text-shadow:0 0 4px #000}
#pin{position:absolute;left:0;top:0;width:28px;height:40px;margin:-40px 0 0 -14px;pointer-events:none;display:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
#reticle{transition:border-color .3s;position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:1.5px solid rgba(255,210,122,.55);border-radius:50%;pointer-events:none;display:none}
#reticle::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(255,210,122,.8)}
.ov{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 20px)}
.ov .seg{background:rgba(7,11,22,.85)}
.search{position:relative;width:min(260px,calc(100vw - 70px))}
.search input{width:100%;background:rgba(14,21,38,.94);color:var(--fg);border:1px solid var(--line)!important;border:0;border-radius:18px;padding:0 14px;min-height:34px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.search ul{position:absolute;left:0;right:0;top:40px;margin:0;padding:6px 0;list-style:none;background:#0e1526;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.35);max-height:260px;overflow:auto}
.search li button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;font-size:14px;padding:6px 14px;min-height:34px;cursor:pointer}
.search li button:hover{background:#22304d}
.readout{position:absolute;right:max(8px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 40px);font:11px/1.45 var(--fm);color:#cfd6e6;background:rgba(7,11,22,.8);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px 9px;pointer-events:none;text-align:right;max-width:55%}
.zoom{position:absolute;right:max(8px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.zoom button,.btn{background:rgba(14,21,38,.92);color:var(--fg);border:1px solid var(--line);border-radius:8px;min-width:36px;min-height:36px;padding:0 9px;font:inherit;font-size:13px;cursor:pointer}
.frame.light .zoom button{background:#fff;color:#3c4043;border-color:#dadce0;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.btn:hover,.zoom button:hover{border-color:var(--accent)}
.btn.primary,.zoom .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
#scale{color:#c9ccd2!important;position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 46px);font:12px var(--fb);color:#3c4043;text-align:center;pointer-events:none;display:none}
#scale i{display:block;height:6px;border:2px solid #c9ccd2;border-top:0;margin-top:2px}
.sheet{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 62px);width:min(340px,calc(100% - 16px));background:#fff;color:#202124;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.4);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.frame.sky .sheet{bottom:auto;top:calc(max(8px,env(safe-area-inset-top)) + 46px)}
.sheet.dark{background:rgba(14,21,38,.95);color:var(--fg);border:1px solid var(--line)}
.sheet h3{margin:0;font:700 17px/1.2 var(--fd);padding-right:30px}
.sheet p{margin:0;font-size:13px;color:#5f6368}
.sheet.dark p{color:var(--muted)}
.sheet .x{position:absolute;right:2px;top:2px;background:none;border:0;color:inherit;font-size:18px;min-width:32px;min-height:32px;cursor:pointer}
.sheet .go{background:#1a73e8;color:#fff;border:0;border-radius:20px;min-height:40px;padding:0 18px;font:700 15px var(--fb);align-self:stretch;cursor:pointer;align-self:flex-start}
.hint{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 46px);transform:translateX(-50%);font-size:13px;color:#e6e9f2;background:rgba(7,11,22,.85);padding:6px 12px;border-radius:16px;pointer-events:none;max-width:min(440px,calc(100% - 24px));text-align:center;transition:opacity .5s;opacity:1}
.hint.gone{opacity:0}
#nav{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:2px;padding:4px;border-radius:16px;background:rgba(14,21,38,.94);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.4);z-index:3}
#nav button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:66px;padding:5px 10px 4px;border:0;border-radius:12px;background:none;color:var(--muted);font:12px var(--fb);cursor:pointer}
#nav svg{width:20px;height:20px}
#nav button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
#nav button:disabled{opacity:.3}
.frame.light #nav{background:#fff;border-color:#dadce0}
.frame.light #nav button{color:#5f6368}
.frame.light #nav button[aria-pressed=true]{background:#1a73e8;color:#fff}
#quick{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 62px);display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:calc(100% - 16px)}
.qrow{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.qrow[hidden]{display:none}
.pill{min-height:34px;min-width:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:rgba(14,21,38,.9);color:var(--fg);font:13px var(--fb);cursor:pointer}
.pill:hover{border-color:var(--accent)}
.pill.strong{font:700 14px var(--fm)}
.pill.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.pill[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
#tour{position:absolute;inset:0;background:rgba(3,5,12,.55);display:grid;place-items:center;z-index:6;padding:16px}
#tour[hidden]{display:none}
.tcard{background:#fff;color:#202124;border-radius:16px;padding:18px 20px;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tcard h3{margin:0 0 8px;font:700 20px var(--fd)}
.tcard ol{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.tcard .pill{width:100%;min-height:40px}
.frame.light .hint{background:rgba(255,255,255,.9);color:#3c4043}
.deck{display:flex;flex-direction:column;gap:10px}
.tops{gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card h2{font:700 15px var(--fd);margin:0;color:var(--accent)}
.tnow{font:16px var(--fm);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sl{display:flex;flex-direction:column;gap:4px}
.sl label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sl output{font-family:var(--fm);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 10px;min-height:28px;font:inherit;font-size:12px;cursor:pointer}
.chips{gap:5px!important}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;border:1px solid currentColor}
.chip[aria-pressed=true]{color:var(--fg);border-color:var(--accent)}
.chip[aria-pressed=true]::before{background:var(--accent);border-color:var(--accent)}
.vis{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px}
.vis li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:2px 0;font-size:13px}
.vis b{font-weight:700}.vis span{font-family:var(--fm);color:var(--muted);white-space:nowrap}
.muted{color:var(--muted);font-size:12px;margin:0}
footer{color:var(--muted);font-size:11px}
@media(max-width:600px){.readout{font-size:10px}}
.frame.map .readout,.frame.sky:has(.sheet:not([hidden])) .readout{display:none}
</style>
</head>
<body>
<div class="frame light" id="frame">
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <svg id="pin" viewBox="0 0 28 40" aria-hidden="true"><path d="M14 0C6.3 0 0 6.1 0 13.7 0 24 14 40 14 40s14-16 14-26.3C28 6.1 21.7 0 14 0z" fill="#ea4335"/><circle cx="14" cy="13.5" r="5" fill="#a50e0e"/></svg>
    <div id="reticle"></div>
    <div class="ov">
      <div class="search" id="searchbox">
        <input type="search" id="q" autocomplete="off" aria-label="Іздеу">
        <ul id="res" hidden></ul>
      </div>
    </div>
    <button id="night" class="mbtn nbtn" aria-pressed="false" aria-label="Түнгі режим"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg></button>
    <button id="menu" class="mbtn" aria-label="Мәзір" aria-expanded="false">☰</button>
    <div class="readout" id="readout"></div>
    <div class="hint" id="hint"></div>
    <div id="scale"><span id="scale-t"></span><i id="scale-b"></i></div>
    <div class="sheet" id="sheet" hidden>
      <button class="x" id="sheet-x" aria-label="×">×</button>
      <h3 id="sheet-h"></h3>
      <p id="sheet-p"></p>
      <button class="go" id="sheet-go"></button>
    </div>
    <div id="quick">
      <div class="qrow" id="q-sky">
        <button class="pill" data-az="0"></button><button class="pill" data-az="90"></button><button class="pill" data-az="180"></button><button class="pill" data-az="270"></button>
        <button class="pill" data-az="up" id="q-up"></button><button class="pill" id="roof"></button>
      </div>
      <div class="qrow" id="q-time">
        <button class="pill" id="t-m">−1</button><button class="pill strong" id="t-now"></button><button class="pill" id="t-p">+1</button><button class="pill" id="t-play" aria-pressed="false">▶</button>
      </div>
      <div class="qrow"><button class="pill go" id="fly"></button></div>
    </div>
    <nav id="nav" aria-label="Режим">
      <button id="m-map" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zm0 2 6 2v10l-6-2V6z" fill="currentColor"/></svg><span>Карта</span></button>
      <button id="m-out" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Глобус</span></button>
      <button id="m-in" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 2 2.4 6.6L21 9l-5.2 4.3L17.6 20 12 16.3 6.4 20l1.8-6.7L3 9l6.6-.4z" fill="currentColor"/></svg><span>Аспан</span></button>
    </nav>
    <div id="tour" hidden><div class="tcard"><h3 id="tour-h"></h3><ol id="tour-l"></ol><button class="pill go" id="tour-ok"></button></div></div>
    <div class="zoom">
      <button id="z-in" aria-label="+">+</button>
      <button id="z-out" aria-label="−">−</button>
      <button id="z-reset" aria-label="⟲">⟲</button>
    </div>
  </div>

<aside id="panel" hidden>

  <header>
    <div>
      <h1 id="title"><span>Ақтау</span> аспаны · 3D</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tops">
      <select id="city" aria-label="Қала"></select>
      <div class="seg" role="group" aria-label="Тіл">
        <button id="lang-kk" aria-pressed="true">ҚАЗ</button>
        <button id="lang-ru" aria-pressed="false">РУС</button>
      </div>
    </div>
  </header>

    <div class="deck">
    <section class="card">
      <h2 id="h-time">Уақыт</h2>
      <div class="tnow" id="tnow">—</div>
      <div class="row">
        <input type="datetime-local" id="date" aria-label="Күні">
        <button class="btn primary" id="now">Қазір</button>
        <button class="btn" id="tonight">22:00</button>
        <button class="btn" id="play" aria-pressed="false">▶</button>
      </div>
      <div class="sl">
        <label for="shift"><span id="l-shift">Уақытты жылжыту</span><output id="shift-out">0</output></label>
        <input type="range" id="shift" min="-720" max="720" step="10" value="0">
      </div>
      <div class="row">
        <button class="btn" data-step="-1" id="d-m">− 1</button>
        <button class="btn" data-step="1" id="d-p">+ 1</button>
        <button class="btn" data-step="-30" id="mo-m">− 30</button>
        <button class="btn" data-step="30" id="mo-p">+ 30</button>
      </div>
    </section>
    <section class="card">
      <h2 id="h-view">Көрініс</h2>
      <div class="chips" id="chips"></div>
      <div class="sl">
        <label for="mag"><span id="l-mag">Ең күңгірт жұлдыз</span><output id="mag-out">5.0</output></label>
        <input type="range" id="mag" min="2" max="5.5" step="0.25" value="5">
      </div>
    </section>
    <section class="card">
      <h2 id="h-vis">Көкжиектен жоғары</h2>
      <ul class="vis" id="vis"></ul>
      <p class="muted" id="vis-note"></p>
    </section>
  </div>
  <footer id="footer"></footer>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const D2R=Math.PI/180,R=100;
const CITIES=[
 {kk:'Ақтау',ru:'Актау',lat:43.65,lon:51.17},{kk:'Атырау',ru:'Атырау',lat:47.11,lon:51.92},
 {kk:'Жаңаөзен',ru:'Жанаозен',lat:43.34,lon:52.86},{kk:'Қызылорда',ru:'Кызылорда',lat:44.85,lon:65.51},
 {kk:'Шымкент',ru:'Шымкент',lat:42.32,lon:69.59},{kk:'Алматы',ru:'Алматы',lat:43.24,lon:76.89},{kk:'Астана',ru:'Астана',lat:51.17,lon:71.45}];

$('z-in').onclick=()=>zoom(1/1.25);$('z-out').onclick=()=>zoom(1.25);
$('fly').onclick=()=>{if(mode==='in'){setMode('map');return;}if(mode==='out')fly={from:Math.log(view.out.dist),to:Math.log(.02),p0:view.out.pitch,p1:-1.35,y0:view.out.yaw,t:0};};
$('z-reset').onclick=()=>{fly=null;if(mode==='map')Object.assign(map,{cx:0,cz:0,span:14});else if(mode==='out')Object.assign(view.out,{yaw:-.5,pitch:-.35,dist:290});else Object.assign(view.in,{yaw:Math.PI,pitch:.6,fov:75});dirty=true;};
// search microdistricts
$('q').addEventListener('input',function(){const q=this.value.trim().toLowerCase().replace(/\s.*$/,'');const res=$('res');
  if(!q){res.hidden=true;return;}const hits=MKR.filter(m=>m[0].toLowerCase().startsWith(q)).slice(0,8);
  res.innerHTML=hits.map(m=>`<li><button data-n="${m[0]}">${T[lang].mkr(m[0])}</button></li>`).join('');res.hidden=!hits.length;});
$('res').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=MKR.find(x=>x[0]===b.dataset.n);$('res').hidden=true;$('q').value=T[lang].mkr(m[0]);
  map.span=2.2;dropPin(m.x,m.z,true);};

/* ---------- UI ---------- */
const pad=n=>String(n).padStart(2,'0');
const toInput=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const cur=()=>new Date(base.getTime()+shiftMin*6e4);
function fmtDate(d){if(lang==='kk'){const M=['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'];
  return d.getFullYear()+' ж. '+d.getDate()+' '+M[d.getMonth()]+' · '+pad(d.getHours())+':'+pad(d.getMinutes());}
  return d.toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function refresh(){if(!sky)return;const d=cur(),r=updateSky(d),t=T[lang];
  $('tnow').textContent=fmtDate(d);$('t-now').textContent=pad(d.getHours())+':'+pad(d.getMinutes());$('t-m').textContent='−1 '+t.h;$('t-p').textContent='+1 '+t.h;const h=shiftMin/60;$('shift-out').textContent=(h>0?'+':'')+(Math.round(h*10)/10)+' '+t.h;
  const where=mode==='in'&&isAk()&&obs?'<br>'+t.obs+': '+(obs.name||placeName(obs.x,obs.z))+', '+(obs.roof?t.roofOn:t.ground):'';
  $('readout').innerHTML=city[lang]+' · '+city.lat.toFixed(2)+'°, '+city.lon.toFixed(2)+'°'+where+'<br>'+t.sunAlt+': '+r.sunAlt.toFixed(1)+'°<br>'+t.moon+': '+Math.round(moonIllum*100)+'%';
  const vis=[];[['sun',objs.sun],['moon',objs.moon],...PL.map(p=>[p.k,objs.pl[p.k]])].forEach(([k,o])=>{const[a,z]=altaz(o.position);if(a>0)vis.push([k==='sun'?N().sun:k==='moon'?N().moon:N().pl[k],a,z]);});
  vis.sort((a,b)=>b[1]-a[1]);
  $('vis').innerHTML=vis.length?vis.map(v=>`<li><b>${v[0]}</b><span>${v[1].toFixed(0)}° / ${v[2].toFixed(0)}°</span></li>`).join(''):`<li>${t.none}</li>`;
  dirty=true;}
function stopPlay(){playing=false;['play','t-play'].forEach(i=>{$(i).setAttribute('aria-pressed','false');$(i).textContent='▶';});}
$('date').onchange=function(){const d=new Date(this.value);if(!isNaN(d)){stopPlay();base=d;shiftMin=0;$('shift').value=0;refresh();}};
$('shift').oninput=function(){stopPlay();shiftMin=+this.value;refresh();};
$('now').onclick=()=>{stopPlay();base=new Date();shiftMin=0;$('shift').value=0;$('date').value=toInput(base);refresh();};
$('tonight').onclick=()=>{stopPlay();const d=new Date();d.setHours(22,0,0,0);base=d;shiftMin=0;$('shift').value=0;$('date').value=toInput(d);refresh();};
$('play').onclick=function(){playing=!playing;this.setAttribute('aria-pressed',playing);this.textContent=playing?'❚❚':'▶';$('t-play').setAttribute('aria-pressed',playing);$('t-play').textContent=this.textContent;};
['d-m','d-p','mo-m','mo-p'].forEach(id=>$(id).onclick=function(){stopPlay();base=new Date(base.getTime()+(+this.dataset.step)*864e5);$('date').value=toInput(base);refresh();});
$('mag').oninput=function(){$('mag-out').textContent=(+this.value).toFixed(2).replace(/0$/,'');dirty=true;};
CITIES.forEach((c,i)=>{const o=document.createElement('option');o.value=i;$('city').appendChild(o);});
$('city').onchange=function(){city=CITIES[+this.value];obs=null;setMode(isAk()?'map':mode==='map'?'in':mode);refresh();};
function renderChips(){const t=T[lang];$('chips').innerHTML=Object.keys(show).map(k=>`<button class="chip" data-k="${k}" aria-pressed="${show[k]}">${t.chips[k]}</button>`).join('');}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;show[b.dataset.k]=!show[b.dataset.k];applyShow();renderChips();};
function applyShow(){if(!sky)return;objs.con.visible=show.con;objs.gal.visible=show.gal;objs.eq.visible=show.eq;objs.ec.visible=show.ec;grid.visible=show.grid;
  objs.sun.visible=objs.moon.visible=show.pl;PL.forEach(p=>objs.pl[p.k].visible=show.pl);placeWorld();dirty=true;}
function renderText(){const t=T[lang];
  $('title').innerHTML=`<span>${city[lang]}</span> ${lang==='kk'?'аспаны':'— небо'} · 3D`;$('sub').textContent=t.sub;
  [...$('city').options].forEach((o,i)=>o.textContent=CITIES[i][lang]);
  $('m-map').lastChild.textContent=t.map;$('m-out').lastChild.textContent=t.out;$('m-in').lastChild.textContent=t.in;
  document.querySelectorAll('#q-sky [data-az]').forEach(b=>{const a=b.dataset.az;b.textContent=a==='up'?t.zen:t.card[[0,90,180,270].indexOf(+a)];});
  $('tour-h').textContent=t.tourH;$('tour-l').innerHTML=t.tourL.map(x=>'<li>'+x+'</li>').join('');$('tour-ok').textContent=t.tourOk;$('m-map').disabled=!isAk();
  $('q').placeholder=t.search;$('h-time').textContent=t.time;$('now').textContent=t.now;$('l-shift').textContent=t.shift;
  ['d-m','d-p','mo-m','mo-p'].forEach(id=>{const s=+$(id).dataset.step;$(id).textContent=(s<0?'− ':'+ ')+Math.abs(s)+' '+t.day;});
  $('h-view').textContent=t.view;$('l-mag').textContent=t.mag;$('h-vis').textContent=t.vis;$('vis-note').textContent=t.note+' '+t.city;$('footer').textContent=t.footer;

  $('fly').textContent=mode==='in'?t.seeMap:t.fly;$('fly').parentNode.hidden=!isAk()||mode==='map';$('q-sky').hidden=mode!=='in';$('q-time').hidden=mode==='map';
  $('roof').textContent=obs&&obs.roof?t.toGround:t.toRoof;
  labels.forEach(L=>L.el.textContent=L.txt());}
function setLang(l){lang=l;try{localStorage.setItem('aktau-sky-lang',l);}catch(e){}document.documentElement.lang=l;
  $('lang-kk').setAttribute('aria-pressed',l==='kk');$('lang-ru').setAttribute('aria-pressed',l==='ru');renderText();renderChips();refresh();}
$('lang-kk').onclick=()=>setLang('kk');$('lang-ru').onclick=()=>setLang('ru');

/* ---------- render loop ---------- */
const night=new THREE.Color(0x03050c),dusk=new THREE.Color(0x24406e),day=new THREE.Color(0x6fa3d8),bg=new THREE.Color(),loc=new THREE.Color();
function resize(){const w=frame.clientWidth,h=frame.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;dirty=true;}
const ro=new ResizeObserver(resize);ro.observe(frame);
function scaleBar(){const h=canvas.clientHeight,kmPx=map.span/h;let L=[.05,.1,.2,.5,1,2,5,10,20].find(v=>v/kmPx>=70)||20;
  $('scale-t').textContent=L<1?(L*1000)+' м':L+' км';$('scale-b').style.width=(L/kmPx|0)+'px';}
let last=performance.now();
function loop(now){const dt=now-last;last=now;
  if(fly){fly.t=Math.min(1,fly.t+dt/2800);const e=fly.t<.5?2*fly.t*fly.t:1-2*(1-fly.t)**2;view.out.dist=Math.exp(fly.from+(fly.to-fly.from)*e);
    view.out.pitch=fly.p0+(fly.p1-fly.p0)*e;view.out.yaw=fly.y0*(1-e);dirty=true;if(fly.t>=1){fly=null;map.span=.83*view.out.dist/KM;map.cx=map.cz=0;setMode('map');}}
  if(look){look.t=Math.min(1,look.t+dt/700);const e=1-(1-look.t)**3;view.in.yaw=look.y0+(look.y1-look.y0)*e;view.in.pitch=look.p0+(look.p1-look.p0)*e;dirty=true;if(look.t>=1)look=null;}
  if(playing&&sky){shiftMin+=dt/1000*60;if(shiftMin>720||shiftMin<-720){base=cur();shiftMin=0;}$('shift').value=Math.max(-720,Math.min(720,shiftMin));refresh();}
  if(dirty&&sky){dirty=false;placeCam();const w=frame.clientWidth,h=frame.clientHeight;
    if(mode==='map'){renderer.render(mapScene,mapCam);updateLabels(mapCam,w,h);scaleBar();$('scale').style.display='block';
      const pe=$('pin');if(pinAt){tmp.set(pinAt.x*KM,0,pinAt.z*KM).project(mapCam);pe.style.display='block';pe.style.transform=`translate(${((tmp.x*.5+.5)*w)|0}px,${((-tmp.y*.5+.5)*h)|0}px)`;}else pe.style.display='none';}
    else{$('scale').style.display='none';
      if(dayFactor<.5)loc.copy(night).lerp(dusk,dayFactor*2);else loc.copy(dusk).lerp(day,(dayFactor-.5)*2);
      const a=mode==='in'?1:Math.min(1,Math.max(0,Math.log(.6/view.out.dist)/Math.log(30)));
      const df=isNight()?0:dayFactor;if(isNight())loc.copy(night);
      bg.copy(night).lerp(loc,a);starMat.uniforms.uOp.value=1-a*df*.95;
      ground.material.color.setHex(df>.5?0x6b6150:0x15130f);bldMat.emissive.setHex(df<.4?0xffffff:0x000000);
      cityLight.intensity=isNight()?.12:cityLight.userData.i;
      if(mode==='in'){updateGaze();objs.con.material.opacity=.2;}else objs.con.material.opacity=.55;
      scene.background=bg;renderer.autoClear=true;renderer.render(scene,cam);
      if(city3d.visible){const n0=cam.near,f0=cam.far;
        if(mode==='in'){cam.near=2e-7;cam.far=.3;}else{cam.near=Math.max(1e-6,view.out.dist*.01);cam.far=view.out.dist+.3;}
        cam.updateProjectionMatrix();renderer.autoClear=false;renderer.clearDepth();renderer.render(cityScene,cam);renderer.autoClear=true;
        cam.near=n0;cam.far=f0;cam.updateProjectionMatrix();}
      updateLabels(cam,w,h);}}
  requestAnimationFrame(loop);}
$('date').value=toInput(base);$('city').value=0;
fetch('sky.json').then(r=>r.json()).then(build).catch(err=>{$('readout').textContent='✕ '+err.message;});
requestAnimationFrame(loop);
}
</script>
</body>
