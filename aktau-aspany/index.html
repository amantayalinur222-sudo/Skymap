<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Ақтау аспаны</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Sans+Narrow:wght@700&family=PT+Mono&display=swap">
<style>
/* Layout: a night-sky instrument — the star map is the page; a control deck sits under it like an observer's logbook. Deliberately dark-only. */
:root{
  color-scheme: dark;
  --bg:#070b16;            /* deep night */
  --panel:#0e1526;         /* deck surface */
  --line:#22304d;          /* hairlines */
  --fg:#e6e9f2;            /* text */
  --muted:#8f9ab3;         /* quiet text */
  --accent:#f2c14e;        /* star gold */
  --accent-ink:#1a1405;
  --font-display:"PT Sans Narrow","PT Sans","Arial Narrow",sans-serif;
  --font-body:"PT Sans","Segoe UI",Roboto,sans-serif;
  --font-data:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
}
body.night{
  --bg:#0d0303; --panel:#170606; --line:#3d1010; --fg:#ff8a7a; --muted:#b5574c; --accent:#ff4d3a; --accent-ink:#1a0202;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.top-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

select,input[type=datetime-local],input[type=number]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;font-size:14px;min-width:0}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}

.sky-frame{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
#starmap{width:100%;height:min(74vh,720px);min-height:340px}
body.night .sky-frame{filter:grayscale(1) sepia(1) saturate(7) hue-rotate(-38deg) brightness(.85)}
.readout{position:absolute;right:10px;top:10px;font-family:var(--font-data);font-size:12px;color:#cfd6e6;background:rgba(7,11,22,.72);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px 9px;pointer-events:none;text-align:right;line-height:1.5}

.deck{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media (max-width:820px){.deck{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--font-display);font-size:18px;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

.time-now{font-family:var(--font-data);font-size:clamp(20px,3.4vw,28px);font-variant-numeric:tabular-nums;color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}

.slider{display:flex;flex-direction:column;gap:4px}
.slider label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.slider output{font-family:var(--font-data);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.ticks{display:flex;justify-content:space-between;font-family:var(--font-data);font-size:11px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;border:1px solid currentColor}
.chip[aria-pressed=true]{color:var(--fg);border-color:var(--accent)}
.chip[aria-pressed=true]::before{background:var(--accent);border-color:var(--accent)}
.chip kbd{font-family:var(--font-data);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}

.coords{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.coords label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.coords input{width:100%}
@media (max-width:520px){.coords{grid-template-columns:1fr 1fr}.coords .btn{grid-column:1/-1}}
.row>*{min-width:0;max-width:100%}
.chip{max-width:100%;text-align:left}

.tips{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.tips b{color:var(--fg);font-weight:700}
footer{color:var(--muted);font-size:13px}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="title"><span>Ақтау</span> аспаны</h1>
      <p class="sub" id="subtitle">Каспий жағасынан көрінетін жұлдыздар, шоқжұлдыздар мен планеталар</p>
    </div>
    <div class="top-controls">
      <select id="city" aria-label="Қала"></select>
      <div class="seg" role="group" aria-label="Тіл">
        <button id="lang-kk" aria-pressed="true">ҚАЗ</button>
        <button id="lang-ru" aria-pressed="false">РУС</button>
      </div>
    </div>
  </header>

  <div class="sky-frame">
    <div id="starmap"></div>
    <div class="readout" id="readout"></div>
  </div>

  <div class="deck">
    <section class="card" aria-labelledby="h-time">
      <h2 id="h-time">Уақыт</h2>
      <div class="time-now" id="time-now">—</div>
      <div class="row">
        <input type="datetime-local" id="date" aria-label="Күні">
        <button class="btn primary" id="now">Қазір</button>
        <button class="btn" id="live" aria-pressed="false">Тікелей</button>
        <button class="btn" id="tonight">Бүгін 22:00</button>
      </div>
      <div class="slider">
        <label for="shift"><span id="l-shift">Уақытты жылжыту</span><output id="shift-out">0 сағ</output></label>
        <input type="range" id="shift" min="-720" max="720" step="10" value="0">
        <div class="ticks"><span>−12</span><span>−6</span><span>0</span><span>+6</span><span>+12</span></div>
      </div>
      <div class="row">
        <button class="btn" data-step="-86400" id="d-minus">− 1 күн</button>
        <button class="btn" data-step="86400" id="d-plus">+ 1 күн</button>
        <button class="btn" data-step="-604800" id="w-minus">− 1 апта</button>
        <button class="btn" data-step="604800" id="w-plus">+ 1 апта</button>
      </div>
    </section>

    <section class="card" aria-labelledby="h-view">
      <h2 id="h-view">Көрініс</h2>
      <div class="row">
        <select id="projection" aria-label="Проекция"></select>
      </div>
      <div class="chips" id="chips"></div>
      <div class="slider">
        <label for="mag"><span id="l-mag">Ең күңгірт жұлдыз (магнитуда)</span><output id="mag-out">5.0</output></label>
        <input type="range" id="mag" min="2" max="7" step="0.25" value="5">
      </div>
      <div class="slider">
        <label for="az"><span id="l-az">Қарау бағыты</span><output id="az-out">180°</output></label>
        <input type="range" id="az" min="0" max="355" step="5" value="180">
      </div>
    </section>

    <section class="card" aria-labelledby="h-place">
      <h2 id="h-place">Орын</h2>
      <div class="coords">
        <label><span id="l-lat">Ендік</span><input type="number" id="lat" step="0.01" min="-90" max="90"></label>
        <label><span id="l-lon">Бойлық</span><input type="number" id="lon" step="0.01" min="-180" max="180"></label>
        <button class="btn" id="apply-geo">Қолдану</button>
      </div>
    </section>

    <section class="card" aria-labelledby="h-tips">
      <h2 id="h-tips">Кеңестер</h2>
      <ul class="tips" id="tips"></ul>
    </section>
  </div>

  <footer id="footer"></footer>
</div>

<script src="stuquery.min.js"></script>
<script src="virtualsky.js"></script>
<script>
(function(){
  var CITIES = [
    {id:'aktau', kk:'Ақтау', ru:'Актау', lat:43.65, lon:51.17},
    {id:'atyrau', kk:'Атырау', ru:'Атырау', lat:47.11, lon:51.92},
    {id:'kyzylorda', kk:'Қызылорда', ru:'Кызылорда', lat:44.85, lon:65.51},
    {id:'shymkent', kk:'Шымкент', ru:'Шымкент', lat:42.32, lon:69.59},
    {id:'almaty', kk:'Алматы', ru:'Алматы', lat:43.24, lon:76.89},
    {id:'astana', kk:'Астана', ru:'Астана', lat:51.17, lon:71.45},
    {id:'santabarbara', kk:'Санта-Барбара (бастапқы мысал)', ru:'Санта-Барбара (исходный пример)', lat:34.4326, lon:-119.86286}
  ];
  var PROJ = ['stereo','polar','fisheye','lambert','ortho','mollweide','equirectangular'];
  var T = {
    kk:{title:'<span>{c}</span> аспаны',sub:'Жұлдыздар, шоқжұлдыздар мен планеталар — нақты уақытта',time:'Уақыт',now:'Қазір',live:'Тікелей',tonight:'Бүгін 22:00',shift:'Уақытты жылжыту',h:'сағ',
      dm:'− 1 күн',dp:'+ 1 күн',wm:'− 1 апта',wp:'+ 1 апта',view:'Көрініс',mag:'Ең күңгірт жұлдыз (магнитуда)',az:'Қарау бағыты',place:'Орын',lat:'Ендік',lon:'Бойлық',apply:'Қолдану',tips:'Кеңестер',
      proj:{stereo:'Стерео проекция',polar:'Полярлық',fisheye:'Балықкөз',lambert:'Ламберт',ortho:'Ортографиялық',mollweide:'Мольвейде (бүкіл аспан)',equirectangular:'Тікбұрышты (бүкіл аспан)'},
      chips:{con:'Шоқжұлдыз сызықтары',names:'Шоқжұлдыз атаулары',starlabels:'Жұлдыз атаулары',planets:'Планеталар, Күн, Ай',galaxy:'Құс жолы',ground:'Жер',azgrid:'Биіктік торы',ec:'Эклиптика',meteor:'Метеор ағындары',night:'Түнгі қызыл режим'},
      tipList:['<b>Тінтуірмен</b> немесе саусақпен сүйреп, аспанды айналдырыңыз.','<b>Солтүстікке</b> қарасаңыз, Темірқазық пен Жетіқарақшыны табасыз (бағыт = 0°).','<b>Түнгі қызыл режим</b> далада көздің қараңғыға үйренуін сақтайды.','Пернелер: <b>c</b> сызықтар, <b>v</b> атаулар, <b>?</b> барлық пернелер.'],
      readout:function(c,lat,lon){return c+'<br>'+fmt(lat,'С','О')+' · '+fmt(lon,'Ш','Б');},
      footer:'Карта: <a href="https://slowe.github.io/VirtualSky/" target="_blank" rel="noopener">VirtualSky</a> (Stuart Lowe, LCO) негізінде, білім беру мақсатында. Уақыт браузердің жергілікті уақытында көрсетіледі.'},
    ru:{title:'Небо: <span>{c}</span>',sub:'Звёзды, созвездия и планеты в реальном времени',time:'Время',now:'Сейчас',live:'В реальном времени',tonight:'Сегодня 22:00',shift:'Сдвиг времени',h:'ч',
      dm:'− 1 день',dp:'+ 1 день',wm:'− 1 неделя',wp:'+ 1 неделя',view:'Вид',mag:'Самая слабая звезда (звёздная величина)',az:'Направление взгляда',place:'Место',lat:'Широта',lon:'Долгота',apply:'Применить',tips:'Подсказки',
      proj:{stereo:'Стереографическая',polar:'Полярная',fisheye:'«Рыбий глаз»',lambert:'Ламберта',ortho:'Ортографическая',mollweide:'Мольвейде (всё небо)',equirectangular:'Прямоугольная (всё небо)'},
      chips:{con:'Линии созвездий',names:'Названия созвездий',starlabels:'Названия звёзд',planets:'Планеты, Солнце, Луна',galaxy:'Млечный Путь',ground:'Земля',azgrid:'Сетка высот',ec:'Эклиптика',meteor:'Метеорные потоки',night:'Красный ночной режим'},
      tipList:['<b>Тяните</b> мышью или пальцем, чтобы вращать небо.','Повернитесь на <b>север</b> (направление 0°), чтобы найти Полярную и Большую Медведицу.','<b>Красный ночной режим</b> сохраняет ночное зрение на улице.','Клавиши: <b>c</b> линии, <b>v</b> названия, <b>?</b> все клавиши.'],
      readout:function(c,lat,lon){return c+'<br>'+fmt(lat,'с.ш.','ю.ш.')+' · '+fmt(lon,'в.д.','з.д.');},
      footer:'Карта на основе <a href="https://slowe.github.io/VirtualSky/" target="_blank" rel="noopener">VirtualSky</a> (Stuart Lowe, LCO), для образовательных целей. Время показано в местном времени браузера.'}
  };
  function fmt(v,pos,neg){return Math.abs(v).toFixed(2)+'° '+(v>=0?pos:neg);}

  var CHIPS = [
    {k:'con',key:'c',on:true,fn:'toggleConstellationLines'},
    {k:'names',key:'v',on:true,fn:'toggleConstellationLabels'},
    {k:'starlabels',key:'S',on:true,fn:'toggleStarLabels'},
    {k:'planets',key:'p',on:true,fn:'togglePlanetHints'},
    {k:'galaxy',key:'M',on:true,fn:'toggleGalaxy'},
    {k:'ground',key:'g',on:false,fn:'toggleGround'},
    {k:'azgrid',key:'z',on:false,fn:'toggleGridlinesAzimuthal'},
    {k:'ec',key:',',on:false,fn:'toggleEcliptic'},
    {k:'meteor',key:'R',on:false,fn:'toggleMeteorShowers'},
    {k:'night',key:'',on:false,fn:null}
  ];

  var $ = function(id){return document.getElementById(id);};
  var lang = 'kk', city = CITIES[0], base = new Date(), shiftMin = 0;
  try{ var saved = localStorage.getItem('aktau-sky-lang'); if(saved==='ru'||saved==='kk') lang = saved; }catch(e){}

  var sky = S.virtualsky({
    id:'starmap', projection:'stereo', latitude:city.lat, longitude:city.lon, az:180,
    lang:lang, constellations:true, constellationlabels:true, showstarlabels:true,
    showgalaxy:true, showplanets:true, showplanetlabels:true, gradient:true,
    magnitude:5, ground:false, cardinalpoints:true, showposition:false, showdate:false,
    live:false, mouse:true, keyboard:true, fontfamily:'PT Sans, sans-serif'
  });

  // Keep our chip state in sync when the keyboard toggles things
  var keyIndex = {}; CHIPS.forEach(function(c){ if(c.key) keyIndex[c.key]=c; });
  document.addEventListener('keypress', function(e){
    var c = keyIndex[e.key]; if(c && document.activeElement && !/INPUT|SELECT/.test(document.activeElement.tagName)){ c.on=!c.on; renderChips(); }
  });

  // City select
  CITIES.forEach(function(c,i){ var o=document.createElement('option'); o.value=i; $('city').appendChild(o); });
  $('city').addEventListener('change', function(){ city = CITIES[+this.value]; applyGeo(city.lat, city.lon); });
  function applyGeo(lat,lon){ sky.setLatitude(lat).setLongitude(lon); sky.draw(); $('lat').value=lat; $('lon').value=lon; renderText(); }
  $('apply-geo').addEventListener('click', function(){
    var lat=parseFloat($('lat').value), lon=parseFloat($('lon').value);
    if(isNaN(lat)||isNaN(lon)||Math.abs(lat)>90||Math.abs(lon)>180) return;
    city = {id:'custom',kk:'Таңдалған орын',ru:'Выбранное место',lat:lat,lon:lon}; $('city').value=''; applyGeo(lat,lon);
  });

  // Projection
  PROJ.forEach(function(p){ var o=document.createElement('option'); o.value=p; $('projection').appendChild(o); });
  $('projection').addEventListener('change', function(){ sky.selectProjection(this.value); sky.draw(); });

  // Chips
  function renderChips(){
    var box=$('chips'); box.innerHTML='';
    CHIPS.forEach(function(c){
      var b=document.createElement('button'); b.className='chip'; b.type='button'; b.setAttribute('aria-pressed', c.on);
      b.textContent=T[lang].chips[c.k];
      if(c.key){ var k=document.createElement('kbd'); k.textContent=c.key; b.appendChild(k); }
      b.addEventListener('click', function(){
        c.on=!c.on;
        if(c.fn) sky[c.fn](); else document.body.classList.toggle('night', c.on);
        renderChips();
      });
      box.appendChild(b);
    });
  }

  // Time
  function pad(n){return (n<10?'0':'')+n;}
  function toLocalInput(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
  function current(){ return new Date(base.getTime()+shiftMin*60000); }
  function setTime(){ var d=current(); sky.setClock(d); sky.calendarUpdate(); showTime(d); }
  function showTime(d){
    var s;
    if(lang==='kk'){
      var M=['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'];
      var W=['жс','дс','сс','ср','бс','жм','сб'];
      s = d.getFullYear()+' ж. '+d.getDate()+' '+M[d.getMonth()]+', '+W[d.getDay()]+' · '+pad(d.getHours())+':'+pad(d.getMinutes());
    } else {
      try{ s = d.toLocaleString('ru-RU',{weekday:'short',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
      catch(e){ s = d.toString(); }
    }
    $('time-now').textContent = s;
    var h = shiftMin/60; $('shift-out').textContent = (h>0?'+':'')+(Math.round(h*10)/10)+' '+T[lang].h;
  }
  function stopLive(){ if(sky.islive){ sky.stop(); $('live').setAttribute('aria-pressed','false'); clearInterval(liveTimer); } }
  var liveTimer;
  $('date').addEventListener('change', function(){ var d=new Date(this.value); if(!isNaN(d)){ stopLive(); base=d; shiftMin=0; $('shift').value=0; setTime(); } });
  $('shift').addEventListener('input', function(){ stopLive(); shiftMin=+this.value; setTime(); });
  $('now').addEventListener('click', function(){ stopLive(); base=new Date(); shiftMin=0; $('shift').value=0; $('date').value=toLocalInput(base); setTime(); });
  $('tonight').addEventListener('click', function(){ stopLive(); var d=new Date(); d.setHours(22,0,0,0); base=d; shiftMin=0; $('shift').value=0; $('date').value=toLocalInput(d); setTime(); });
  $('live').addEventListener('click', function(){
    if(sky.islive){ stopLive(); return; }
    base=new Date(); shiftMin=0; $('shift').value=0; sky.start(); this.setAttribute('aria-pressed','true');
    liveTimer=setInterval(function(){ base=new Date(); showTime(base); },1000); showTime(base);
  });
  ['d-minus','d-plus','w-minus','w-plus'].forEach(function(id){
    $(id).addEventListener('click', function(){ stopLive(); base=new Date(base.getTime()+(+this.dataset.step)*1000); $('date').value=toLocalInput(base); setTime(); });
  });

  // Magnitude & azimuth
  $('mag').addEventListener('input', function(){ var m=+this.value; sky.changeMagnitude(m - sky.magnitude); $('mag-out').textContent=m.toFixed(2).replace(/0$/,''); });
  $('az').addEventListener('input', function(){ sky.az_off = +this.value; sky.draw(); $('az-out').textContent=this.value+'°'; });

  // Language
  function setLang(l){
    lang=l; try{ localStorage.setItem('aktau-sky-lang', l); }catch(e){}
    $('lang-kk').setAttribute('aria-pressed', l==='kk'); $('lang-ru').setAttribute('aria-pressed', l==='ru');
    document.documentElement.lang = l;
    sky.changeLanguage(l);
    renderText(); renderChips();
  }
  $('lang-kk').addEventListener('click', function(){ setLang('kk'); });
  $('lang-ru').addEventListener('click', function(){ setLang('ru'); });

  function renderText(){
    var t=T[lang], cname = city[lang];
    $('title').innerHTML = t.title.replace('{c}', cname.replace(/ \(.*\)$/,''));
    document.title = lang==='kk' ? 'Ақтау аспаны' : 'Небо Актау';
    $('subtitle').textContent=t.sub;
    Array.prototype.forEach.call($('city').options,function(o,i){ o.textContent=CITIES[i][lang]; });
    Array.prototype.forEach.call($('projection').options,function(o){ o.textContent=t.proj[o.value]; });
    $('h-time').textContent=t.time; $('now').textContent=t.now; $('live').textContent=t.live; $('tonight').textContent=t.tonight;
    $('l-shift').textContent=t.shift; $('d-minus').textContent=t.dm; $('d-plus').textContent=t.dp; $('w-minus').textContent=t.wm; $('w-plus').textContent=t.wp;
    $('h-view').textContent=t.view; $('l-mag').textContent=t.mag; $('l-az').textContent=t.az;
    $('h-place').textContent=t.place; $('l-lat').textContent=t.lat; $('l-lon').textContent=t.lon; $('apply-geo').textContent=t.apply;
    $('h-tips').textContent=t.tips; $('tips').innerHTML=t.tipList.map(function(x){return '<li>'+x+'</li>';}).join('');
    $('readout').innerHTML=t.readout(cname, city.lat, city.lon);
    $('footer').innerHTML=t.footer;
    showTime(current());
  }

  // Resize with the window
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ sky.resize(); },150); });

  // Init
  $('city').value=0; $('projection').value='stereo'; $('lat').value=city.lat; $('lon').value=city.lon;
  $('date').value=toLocalInput(base);
  document.documentElement.lang = lang;
  $('lang-kk').setAttribute('aria-pressed', lang==='kk'); $('lang-ru').setAttribute('aria-pressed', lang==='ru');
  renderText(); renderChips();
})();
</script>

</body></html>
